<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; connect-src 'self' ws: http:">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Finglongerer</title>
<link rel="stylesheet" href="style.css">
</head><body>
<header><h1>Finglongerer</h1><div class="hbtns"><button id="btn-sort" class="icon" data-i18n-aria="ui.sort" data-i18n-title="ui.sortTitle">&#8693;</button><button id="btn-settings" class="icon" data-i18n-aria="ui.settings">&#9881;</button></div></header>
<nav id="tabs" role="tablist">
  <button type="button" class="tab on" role="tab" data-tab="bose" aria-label="Bose" title="Bose"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#000" stroke="#8a8f98" stroke-width="2"/><text x="24" y="34" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="28" fill="#fff">B</text></svg></button>
  <button type="button" class="tab" role="tab" data-tab="tv" aria-label="Google TV" title="Google TV"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="23" fill="#fff"/><g fill="none" stroke-width="5"><path d="M24 4.5A19.5 19.5 0 0 1 43.5 24" stroke="#34a853"/><path d="M43.5 24A19.5 19.5 0 0 1 24 43.5" stroke="#4285f4"/><path d="M24 43.5A19.5 19.5 0 0 1 4.5 24" stroke="#fbbc05"/><path d="M4.5 24A19.5 19.5 0 0 1 24 4.5" stroke="#ea4335"/></g><text x="24" y="33" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="26" fill="#000">g</text></svg></button>
</nav>
<main>
  <div id="boseview">
  <section id="groups"></section>
  <details id="urlbox" class="card">
    <summary data-i18n="ui.urlSummary"></summary>
    <input id="url-in" data-i18n-ph="ph.url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false">
    <select id="url-to"></select>
    <button id="url-go" data-i18n="ui.play"></button>
  </details>
  <a id="ma-open" class="btnlink" target="_blank" rel="noopener" hidden data-i18n="ui.maOpen"></a>
  </div>
  <section id="tvview" hidden><div id="tvbody" class="card"></div></section>
</main>
<div id="toast" role="status"></div>
<dialog id="dlg">
  <form method="dialog" id="dlg-form">
    <h2 data-i18n="set.title"></h2>
    <label class="lbl"><span data-i18n="set.language"></span>
      <select id="lang-sel"><option value="auto" data-i18n="lang.auto"></option><option value="de">Deutsch</option><option value="en">English</option></select></label>
    <h3 data-i18n="set.tabs"></h3>
    <div class="tabsel"><label><input type="checkbox" id="tab-bose"> Bose SoundTouch</label><label><input type="checkbox" id="tab-tv"> Google TV</label></div>
    <h3 data-i18n="set.boxes"></h3>
    <div id="set-rows"></div>
    <button type="button" id="set-add" data-i18n="set.addBox"></button>
    <h3 data-i18n="set.scan"></h3>
    <label class="lbl"><span data-i18n="set.scanNet"></span>
      <input id="scan-net" data-i18n-ph="ph.net" inputmode="decimal"></label>
    <button type="button" id="scan-go" data-i18n="set.scanGo"></button>
    <div id="scan-res"></div>
    <p class="hint" data-i18n="set.hintBox"></p>
    <h3 data-i18n="set.ma"></h3>
    <input id="ma-url" placeholder="http://192.168.1.10:8095" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false">
    <input id="ma-token" type="password" data-i18n-ph="set.maToken" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="row2"><button type="button" id="ma-scan" data-i18n="set.maScan"></button><button type="button" id="ma-test" data-i18n="set.maTest"></button></div>
    <div id="ma-res"></div>
    <h3 data-i18n="set.tv"></h3>
    <input id="tv-ip" data-i18n-ph="ph.tvip" inputmode="decimal" autocomplete="off" spellcheck="false">
    <button type="button" id="tv-find" data-i18n="set.tvFind"></button>
    <input id="proj-mac" data-i18n-ph="ph.projMac" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="17">
    <div id="tv-found"></div>
    <div class="row2"><button type="button" id="tv-pair" data-i18n="set.tvPair"></button><button type="button" id="tv-test" data-i18n="set.tvTest"></button></div>
    <div class="row2" id="tv-code-row" hidden><input id="tv-code" data-i18n-ph="ph.tvCode" maxlength="6" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="button" id="tv-code-go" data-i18n="set.tvCodeGo"></button></div>
    <p class="hint" id="tv-res"></p>
    <p class="hint" data-i18n="set.hintTv"></p>
    <h3 data-i18n="set.reboot"></h3>
    <div class="row2"><select id="reboot-sel"></select><button type="button" id="reboot-go" data-i18n="set.rebootGo"></button></div>
    <h3 data-i18n="set.diag"></h3>
    <div class="row2"><button type="button" id="diag-go" data-i18n="set.diagGo"></button><button type="button" id="diag-copy" data-i18n="set.diagCopy"></button></div>
    <textarea id="diag-out" readonly rows="8" spellcheck="false" hidden></textarea>
    <h3 data-i18n="set.groups"></h3>
    <div id="grp-edit"></div>
    <button type="button" id="grp-add" data-i18n="set.addGroup"></button>
    <p class="hint" data-i18n="set.hintGroup"></p>
    <p class="err" id="dlg-err"></p>
    <p class="version" id="version"></p>
    <div class="row2">
      <button value="cancel" formnovalidate data-i18n="set.cancel"></button>
      <button id="dlg-save" value="ok" data-i18n="set.save"></button>
    </div>
  </form>
</dialog>
<script src="version.js"></script>
<script src="i18n.js"></script>
<script src="core.js"></script>
<script src="native.js"></script>
<script src="app.js"></script>
</body></html>
