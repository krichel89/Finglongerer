name: APK bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: "Version prüfen (bei Tag muss sie zum Tag passen)"
        run: |
          V=$(node -p "require('./package.json').version")
          echo "VERSION=$V" >> "$GITHUB_ENV"
          node test/version.test.mjs
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$V" ]; then
            echo "Tag ${GITHUB_REF_NAME} passt nicht zur Version $V"; exit 1
          fi
      - name: Übersetzungen und Persönliches prüfen
        run: node test/i18n.test.mjs && node test/hygiene.test.mjs && node test/tv.test.mjs && node test/cast.test.mjs
      - run: node test/core.test.mjs
        continue-on-error: true
      - run: npx cap sync android
      - name: Debug-APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: APK benennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Finglongerer-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Finglongerer-${{ env.VERSION }}-apk
          path: Finglongerer-${{ env.VERSION }}.apk
      - name: Release erstellen (nur bei Tag)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "Finglongerer-$VERSION.apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "Finglongerer-$VERSION.apk" --title "Finglongerer $VERSION" --notes-file CHANGELOG.md
          fi
